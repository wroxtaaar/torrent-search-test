name: Test iTorrents Cache Coverage (isolated)

on:
  push:
    branches: [cache-coverage-test]

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Measure cache coverage
        run: |
          node <<'NODE'
          const queries = ['ubuntu 24.04', 'windows 11', 'linux iso', 'movie 2024', 'game 2025'];
          const providerUrls = [
            q => {
              const u = new URL('https://torrents-csv.com/service/search');
              u.searchParams.set('q', q); u.searchParams.set('size','10'); u.searchParams.set('type','torrent');
              return u;
            },
            q => {
              const u = new URL('https://apibay.org/q.php');
              u.searchParams.set('q', q); u.searchParams.set('cat','0');
              return u;
            }
          ];
          const seen = new Map();

          async function fetchJson(url, ms=10000) {
            const r = await fetch(url, { signal: AbortSignal.timeout(ms), headers: {'user-agent':'TorrentStudio-CacheCoverageTest/1.0'} });
            const body = await r.text();
            if (!r.ok) throw new Error('HTTP '+r.status+' '+body.slice(0,120));
            return body ? JSON.parse(body) : [];
          }

          for (const q of queries) {
            for (const makeUrl of providerUrls) {
              try {
                const rows = await fetchJson(makeUrl(q));
                const arr = Array.isArray(rows) ? rows : (Array.isArray(rows?.torrents) ? rows.torrents : []);
                const source = makeUrl(q).hostname;
                console.log('[SEARCH]', source, q, '=>', arr.length);
                for (const x of arr) {
                  const hash = String(x.infohash || x.info_hash || '').toLowerCase();
                  if (/^[a-f0-9]{40}$/.test(hash)) {
                    seen.set(hash, {hash, title:String(x.name||'Untitled'), source});
                  }
                }
              } catch (e) {
                console.log('[SEARCH ERROR]', makeUrl(q).hostname, q, e.message);
              }
            }
          }

          const items=[...seen.values()].slice(0,50);
          console.log('[SAMPLE] unique infohashes:',items.length);

          async function probe(x) {
            const t=Date.now();
            try {
              const r=await fetch(
                'https://itorrents.net/torrent/'+x.hash.toUpperCase()+'.torrent',
                {
                  signal: AbortSignal.timeout(10000),
                  redirect:'follow',
                  headers:{
                    'user-agent':'TorrentStudio-CacheCoverageTest/1.0',
                    'accept':'application/x-bittorrent,application/octet-stream,*/*'
                  }
                }
              );
              const body=new Uint8Array(await r.arrayBuffer());
              const type=String(r.headers.get('content-type')||'').toLowerCase();
              return {...x,hit:r.ok&&body.length>=32&&!type.includes('text/html'),status:r.status,bytes:body.length,ms:Date.now()-t};
            } catch(e) {
              return {...x,hit:false,status:0,bytes:0,ms:Date.now()-t,error:e.message};
            }
          }

          const results=[];
          for(let i=0;i<items.length;i+=8) results.push(...await Promise.all(items.slice(i,i+8).map(probe)));
          const hits=results.filter(x=>x.hit), misses=results.filter(x=>!x.hit);
          console.log('\\n===== iTORRENTS CACHE COVERAGE =====');
          console.log('Unique infohashes tested:',results.length);
          console.log('Cache hits:',hits.length);
          console.log('Cache misses:',misses.length);
          console.log('Hit rate:',results.length?((hits.length/results.length)*100).toFixed(1)+'%':'N/A');
          console.log('====================================');
          console.log('\\nSample hits:');
          for(const x of hits.slice(0,20)) console.log(x.hash,'|',x.source,'|',x.title.slice(0,100),'|',x.bytes+' bytes','|',x.ms+' ms');
          console.log('\\nSample misses:');
          for(const x of misses.slice(0,20)) console.log(x.hash,'|',x.source,'|',x.title.slice(0,100),'|','status='+x.status);
          NODE
