name: Test iTorrents Cache Coverage

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Measure cache coverage
        env:
          SEARCH_BASE: https://torrent-search-test.onrender.com
        run: |
          node <<'NODE'
          const base = process.env.SEARCH_BASE;
          const queries = ['ubuntu 24.04', 'windows 11', 'linux iso', 'movie 2024', 'game 2025'];
          const limit = 10;
          const seen = new Map();

          async function search(q) {
            const url = new URL('/api/search', base);
            url.searchParams.set('q', q);
            url.searchParams.set('limit', String(limit));
            const t = Date.now();
            const r = await fetch(url);
            const body = await r.text();
            if (!r.ok) throw new Error(q + ': HTTP ' + r.status + ' ' + body.slice(0,200));
            const d = JSON.parse(body);
            console.log('[SEARCH]', q, '=>', d.results.length, 'results in', Date.now() - t, 'ms');
            for (const x of d.results) {
              if (/^[a-f0-9]{40}$/i.test(x.infoHash)) {
                seen.set(x.infoHash.toLowerCase(), x);
              }
            }
          }

          for (const q of queries) {
            try { await search(q); } catch (e) { console.log('[SEARCH ERROR]', e.message); }
          }

          const items = [...seen.values()];
          console.log('[SAMPLE] unique infohashes:', items.length);

          async function probe(x) {
            const url = 'https://itorrents.net/torrent/' + x.infoHash.toUpperCase() + '.torrent';
            const t = Date.now();
            try {
              const r = await fetch(url, {
                redirect: 'follow',
                headers: {
                  'user-agent': 'TorrentStudio-CacheCoverageTest/1.0',
                  'accept': 'application/x-bittorrent,application/octet-stream,*/*'
                }
              });
              const body = new Uint8Array(await r.arrayBuffer());
              const type = String(r.headers.get('content-type') || '').toLowerCase();
              const hit = r.ok && body.length >= 32 && !type.includes('text/html');
              return { ...x, hit, status: r.status, bytes: body.length, ms: Date.now() - t };
            } catch (e) {
              return { ...x, hit:false, status:0, bytes:0, ms:Date.now()-t, error:e.message };
            }
          }

          const results = [];
          const concurrency = 8;
          for (let i = 0; i < items.length; i += concurrency) {
            const batch = await Promise.all(items.slice(i, i + concurrency).map(probe));
            results.push(...batch);
          }

          const hits = results.filter(x => x.hit);
          const misses = results.filter(x => !x.hit);
          console.log('\n===== iTORRENTS CACHE COVERAGE =====');
          console.log('Queries:', queries.length);
          console.log('Unique search results tested:', results.length);
          console.log('Cache hits:', hits.length);
          console.log('Cache misses:', misses.length);
          console.log('Hit rate:', results.length ? ((hits.length / results.length) * 100).toFixed(1) + '%' : 'N/A');
          console.log('====================================');
          console.log('\nHits:');
          for (const x of hits) console.log(x.infoHash, '|', x.source, '|', x.title?.slice(0,100), '|', x.bytes + ' bytes', '|', x.ms + ' ms');
          console.log('\nMisses:');
          for (const x of misses) console.log(x.infoHash, '|', x.source, '|', x.title?.slice(0,100), '|', 'status=' + x.status);
          NODE
